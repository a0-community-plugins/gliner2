<html>
<head>
    <title>GLiNER2</title>
    <script>
        window.gliner2SettingsView = function (context, config) {
            return {
                status: null,
                statusLoading: false,
                installRunning: false,
                testRunning: false,
                testTask: "entities",
                testText: "Ada Lovelace worked with Charles Babbage on the Analytical Engine in London.",
                testSchemaText: '["person", "organization", "location", "date"]',
                testResult: "",
                taskSchemaPresets: {
                    entities: '["person", "organization", "location", "date"]',
                    classify: '{"sentiment": ["positive", "negative", "neutral"]}',
                    json: '{"product": ["name", "price", "features"]}',
                    relations: '["works_for", "located_in", "reports_to"]',
                },
                get readinessTone() {
                    return this.status?.readiness || "checking";
                },
                get readinessLabel() {
                    const labels = {
                        ready: "Runtime ready",
                        loading: "Runtime starting",
                        configured: "Configured · not loaded",
                        failed: "Startup failed",
                        blocked: "Action required",
                        checking: "Checking runtime",
                    };
                    return labels[this.readinessTone] || labels.checking;
                },
                get readinessCopy() {
                    if (this.statusLoading) return "Inspecting the Agent Zero framework runtime…";
                    if (!this.status) return "Runtime status has not loaded yet.";
                    if (this.status.readiness === "ready") {
                        return this.status.mode === "api"
                            ? "The hosted client is initialized and ready for extraction."
                            : `The local model is loaded on ${this.status.resolved_device || "the selected device"}.`;
                    }
                    if (this.status.readiness === "configured") {
                        return "Everything required is present. Connect once to initialize the client.";
                    }
                    if (this.status.readiness === "loading") {
                        const elapsed = this.status.client_loading_seconds;
                        return elapsed == null
                            ? "Model initialization is running in the background."
                            : `Model initialization is running in the background · ${elapsed} seconds.`;
                    }
                    return (this.status.blockers || [])[0] || "Review the checks below.";
                },
                get connectLabel() {
                    if (this.statusLoading) return "Checking…";
                    if (this.status?.client_loading) return "Loading…";
                    if (config.gliner2_mode === "api") return "Connect API";
                    return this.status?.client_loaded ? "Model loaded" : "Load model";
                },
                get installLabel() {
                    return this.installRunning
                        ? "Installing…"
                        : (config.gliner2_mode === "local"
                            ? "Install / repair local runtime"
                            : "Install / repair API runtime");
                },
                get canConnect() {
                    const s = this.status || {};
                    if (this.statusLoading || s.client_loaded || s.client_loading) return false;
                    if (!s.package_installed || !s.package_compatible || !s.runtime_importable) {
                        return false;
                    }
                    if (config.gliner2_mode === "api" && !s.api_key_configured) return false;
                    if (config.gliner2_mode === "local" && config.gliner2_device === "cuda" && !s.torch_cuda_available) {
                        return false;
                    }
                    return true;
                },
                get installNeedsAttention() {
                    const s = this.status || {};
                    return !s.package_installed || !s.package_compatible || !s.runtime_importable;
                },
                get statusCards() {
                    const s = this.status || {};
                    const packageValue = s.package_installed
                        ? `v${s.package_version || "unknown"}`
                        : "Missing";
                    const packageDetail = s.package_installed
                        ? (s.package_compatible ? "Supported package" : "Version needs attention")
                        : (s.package_spec || "Waiting for status");

                    let computeValue = "Checking";
                    let computeDetail = "Reading runtime capabilities";
                    if (s.mode === "api") {
                        computeValue = s.api_key_configured ? "Credential found" : "Credential missing";
                        computeDetail = s.api_key_env || config.gliner2_api_key_env;
                    } else if (s.resolved_device) {
                        computeValue = String(s.resolved_device).toUpperCase();
                        computeDetail = s.torch_cuda_available
                            ? (s.torch_cuda_device_name || "CUDA available")
                            : "CPU inference";
                    }

                    return [
                        {
                            label: "PACKAGE",
                            value: packageValue,
                            detail: packageDetail,
                            ok: !!s.package_installed && !!s.package_compatible,
                        },
                        {
                            label: "ROUTE",
                            value: (config.gliner2_mode || "local").toUpperCase(),
                            detail: config.gliner2_mode === "api"
                                ? "Pioneer-compatible endpoint"
                                : (config.gliner2_model || "Local checkpoint"),
                            ok: true,
                        },
                        {
                            label: "COMPUTE",
                            value: computeValue,
                            detail: computeDetail,
                            ok: s.mode === "api" ? !!s.api_key_configured : !!s.torch_installed,
                        },
                        {
                            label: "CLIENT",
                            value: s.client_loaded
                                ? "Online"
                                : (s.client_loading ? "Starting" : "Cold"),
                            detail: s.client_loaded
                                ? `${s.last_operation || "Initialized"}${s.last_duration_ms != null ? ` · ${s.last_duration_ms} ms` : ""}`
                                : (s.client_loading
                                    ? `${s.client_loading_seconds ?? 0} seconds elapsed`
                                    : "Loads on first extraction"),
                            ok: !!s.client_loaded,
                        },
                    ];
                },
                get primaryBlockers() {
                    return (this.status?.blockers || []).slice(0, 4);
                },
                get primaryWarnings() {
                    return (this.status?.warnings || []).slice(0, 4);
                },
                setTask(task) {
                    this.testTask = task;
                    this.testSchemaText = this.taskSchemaPresets[task] || "";
                    this.testResult = "";
                },
                setMode(mode) {
                    config.gliner2_mode = mode;
                    this.status = null;
                    this.refreshStatus();
                },
                parseSchema() {
                    const raw = (this.testSchemaText || "").trim();
                    if (!raw) return null;
                    try {
                        return JSON.parse(raw);
                    } catch (error) {
                        window.toastFrontendError?.("Schema must be valid JSON.", "GLiNER2");
                        return undefined;
                    }
                },
                async readJson(response) {
                    if (!response) return {};
                    return typeof response.json === "function" ? await response.json() : response;
                },
                async refreshStatus(options = {}) {
                    this.statusLoading = true;
                    try {
                        const response = await fetchApi("plugins/gliner2/status", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                project_name: context.projectName || "",
                                agent_profile: context.agentProfileKey || "",
                                settings: config,
                                load_model: !!options.loadModel,
                            }),
                        });
                        this.status = await this.readJson(response);
                    } catch (error) {
                        this.status = {
                            ok: false,
                            readiness: "blocked",
                            blockers: [error?.message || "Failed to load runtime status."],
                        };
                        window.toastFrontendError?.(this.status.blockers[0], "GLiNER2");
                    } finally {
                        this.statusLoading = false;
                    }
                },
                async loadClient() {
                    if (this.status?.client_loaded) return;
                    await this.refreshStatus({ loadModel: true });
                    if (this.status?.client_loaded) {
                        window.toastFrontendSuccess?.(
                            config.gliner2_mode === "api"
                                ? "GLiNER2 API client connected."
                                : "GLiNER2 model loaded.",
                            "GLiNER2"
                        );
                    } else if (this.status?.client_loading) {
                        window.toastFrontendSuccess?.(
                            "Initialization started in the background. Use Refresh to monitor it.",
                            "GLiNER2"
                        );
                    } else {
                        window.toastFrontendError?.(
                            this.status?.error || this.primaryBlockers[0] || "Client did not initialize.",
                            "GLiNER2"
                        );
                    }
                },
                async installForCurrentMode() {
                    this.installRunning = true;
                    try {
                        const response = await fetchApi("plugins/gliner2/install", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                mode: config.gliner2_mode,
                                project_name: context.projectName || "",
                                agent_profile: context.agentProfileKey || "",
                                settings: config,
                            }),
                        });
                        const result = await this.readJson(response);
                        if (!result.ok) {
                            window.toastFrontendError?.(
                                result.stderr || result.error || "Dependency installation failed.",
                                "GLiNER2"
                            );
                        } else {
                            window.toastFrontendSuccess?.(
                                `${result.package || "GLiNER2"} is installed.`,
                                "GLiNER2"
                            );
                        }
                        await this.refreshStatus();
                    } catch (error) {
                        window.toastFrontendError?.(
                            error?.message || "Dependency installation failed.",
                            "GLiNER2"
                        );
                    } finally {
                        this.installRunning = false;
                    }
                },
                async runTestExtraction() {
                    const schema = this.parseSchema();
                    if (schema === undefined) return;
                    this.testRunning = true;
                    this.testResult = "";
                    try {
                        const response = await fetchApi("plugins/gliner2/test_extract", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                task: this.testTask,
                                text: this.testText,
                                schema,
                                include_confidence: true,
                                include_spans: this.testTask !== "classify",
                                project_name: context.projectName || "",
                                agent_profile: context.agentProfileKey || "",
                                settings: config,
                            }),
                        });
                        const result = await this.readJson(response);
                        this.testResult = JSON.stringify(result, null, 2);
                        if (!result.ok) {
                            if (result.client_loading) {
                                this.status = { ...(this.status || {}), ...result, readiness: "loading" };
                                window.toastFrontendWarning?.(
                                    result.error || "The runtime is starting. Retry shortly.",
                                    "GLiNER2"
                                );
                            } else {
                                window.toastFrontendError?.(
                                    result.error || "Extraction failed.",
                                    "GLiNER2"
                                );
                            }
                        } else {
                            window.toastFrontendSuccess?.("Extraction completed.", "GLiNER2");
                            await this.refreshStatus();
                        }
                    } catch (error) {
                        this.testResult = JSON.stringify(
                            { ok: false, error: error?.message || "Extraction failed." },
                            null,
                            2
                        );
                        window.toastFrontendError?.(
                            error?.message || "Extraction failed.",
                            "GLiNER2"
                        );
                    } finally {
                        this.testRunning = false;
                    }
                },
                async init() {
                    this.setTask(this.testTask);
                    await this.refreshStatus();
                },
            };
        };
    </script>
</head>
<body>
    <div x-data="window.gliner2SettingsView(context, config)" x-init="init()">
        <template x-if="config">
            <main class="gl2-shell">
                <header class="gl2-hero">
                    <div class="gl2-eyebrow">
                        <span class="gl2-mark">G2</span>
                        <span>STRUCTURED INFERENCE / 2.0</span>
                    </div>
                    <h1>Extraction, not another prompt.</h1>
                    <p>
                        Route entities, classifications, typed JSON, and relations through a
                        purpose-built local model or hosted endpoint—then feed the same engine
                        into Agent Zero memory.
                    </p>
                    <div class="gl2-privacy">
                        <span class="material-symbols-outlined" aria-hidden="true">shield_lock</span>
                        <span x-show="config.gliner2_mode === 'local'">
                            Local mode keeps extraction inside this Agent Zero runtime.
                        </span>
                        <span x-show="config.gliner2_mode === 'api'">
                            API mode sends extraction text and schemas to the configured endpoint.
                        </span>
                    </div>
                </header>

                <section class="gl2-console" :data-tone="readinessTone">
                    <div class="gl2-console-head">
                        <div class="gl2-state-copy">
                            <span class="gl2-state-dot" aria-hidden="true"></span>
                            <div>
                                <div class="gl2-state-label" x-text="readinessLabel"></div>
                                <div class="gl2-state-detail" x-text="readinessCopy"></div>
                            </div>
                        </div>
                        <button type="button" class="gl2-button gl2-button-quiet" @click="refreshStatus()" :disabled="statusLoading">
                            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
                            Refresh
                        </button>
                    </div>

                    <div class="gl2-instruments">
                        <template x-for="card in statusCards" :key="card.label">
                            <article class="gl2-instrument" :class="{ 'is-ok': card.ok }">
                                <div class="gl2-instrument-label" x-text="card.label"></div>
                                <div class="gl2-instrument-value" x-text="card.value"></div>
                                <div class="gl2-instrument-detail" x-text="card.detail"></div>
                            </article>
                        </template>
                    </div>

                    <div class="gl2-notices" x-show="primaryBlockers.length || primaryWarnings.length">
                        <template x-for="message in primaryBlockers" :key="`blocker-${message}`">
                            <div class="gl2-notice is-blocker">
                                <span class="material-symbols-outlined" aria-hidden="true">error</span>
                                <span x-text="message"></span>
                            </div>
                        </template>
                        <template x-for="message in primaryWarnings" :key="`warning-${message}`">
                            <div class="gl2-notice is-warning">
                                <span class="material-symbols-outlined" aria-hidden="true">info</span>
                                <span x-text="message"></span>
                            </div>
                        </template>
                    </div>

                    <div class="gl2-action-rail">
                        <button type="button" class="gl2-button" :class="canConnect ? 'gl2-button-primary' : 'gl2-button-secondary'" @click="loadClient()" :disabled="!canConnect">
                            <span class="material-symbols-outlined" aria-hidden="true">power_settings_new</span>
                            <span x-text="connectLabel"></span>
                        </button>
                        <button type="button" class="gl2-button" :class="installNeedsAttention ? 'gl2-button-primary' : 'gl2-button-secondary'" @click="installForCurrentMode()" :disabled="installRunning">
                            <span class="material-symbols-outlined" aria-hidden="true">deployed_code_update</span>
                            <span x-text="installLabel"></span>
                        </button>
                    </div>
                </section>

                <section class="gl2-panel">
                    <div class="gl2-panel-heading">
                        <div>
                            <div class="gl2-kicker">01 / ROUTE</div>
                            <h2>Choose where inference runs</h2>
                        </div>
                        <label class="gl2-master">
                            <span>Plugin enabled</span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_enabled" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                    </div>

                    <div class="gl2-mode-switch" role="group" aria-label="Inference mode">
                        <button type="button" :class="{ 'is-active': config.gliner2_mode === 'local' }" @click="setMode('local')">
                            <span class="material-symbols-outlined" aria-hidden="true">memory</span>
                            <span>
                                <strong>Local runtime</strong>
                                <small>Private · CPU or CUDA</small>
                            </span>
                        </button>
                        <button type="button" :class="{ 'is-active': config.gliner2_mode === 'api' }" @click="setMode('api')">
                            <span class="material-symbols-outlined" aria-hidden="true">cloud</span>
                            <span>
                                <strong>Hosted API</strong>
                                <small>Lightweight · credentialed</small>
                            </span>
                        </button>
                    </div>

                    <div class="gl2-field-grid" x-show="config.gliner2_mode === 'local'">
                        <label class="gl2-field gl2-field-wide">
                            <span>Model checkpoint</span>
                            <small>Hugging Face id or a compatible local checkpoint.</small>
                            <input type="text" x-model="config.gliner2_model" />
                        </label>
                        <label class="gl2-field">
                            <span>Device</span>
                            <small>Auto prefers CUDA when PyTorch can see it.</small>
                            <select x-model="config.gliner2_device">
                                <option value="auto">Auto</option>
                                <option value="cpu">CPU</option>
                                <option value="cuda">CUDA</option>
                            </select>
                        </label>
                        <div class="gl2-option-stack">
                            <label class="gl2-option">
                                <span>
                                    <strong>FP16 quantization</strong>
                                    <small>Applied only when CUDA is active.</small>
                                </span>
                                <span class="toggle">
                                    <input type="checkbox" x-model="config.gliner2_quantize" />
                                    <span class="toggler"></span>
                                </span>
                            </label>
                            <label class="gl2-option">
                                <span>
                                    <strong>torch.compile</strong>
                                    <small>Optional CUDA startup tradeoff for throughput.</small>
                                </span>
                                <span class="toggle">
                                    <input type="checkbox" x-model="config.gliner2_compile" />
                                    <span class="toggler"></span>
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="gl2-field-grid" x-show="config.gliner2_mode === 'api'">
                        <label class="gl2-field">
                            <span>API key environment variable</span>
                            <small>The secret value is never displayed or copied into plugin config.</small>
                            <input type="text" x-model="config.gliner2_api_key_env" />
                        </label>
                        <label class="gl2-field">
                            <span>Custom API base URL</span>
                            <small>Leave blank for the GLiNER2 default endpoint.</small>
                            <input type="url" x-model="config.gliner2_api_base_url" placeholder="Default endpoint" />
                        </label>
                        <label class="gl2-field">
                            <span>Timeout (seconds)</span>
                            <input type="number" min="1" max="300" step="1" x-model.number="config.gliner2_api_timeout_seconds" />
                        </label>
                        <label class="gl2-field">
                            <span>Retry attempts</span>
                            <input type="number" min="0" max="10" step="1" x-model.number="config.gliner2_api_max_retries" />
                        </label>
                    </div>

                    <div class="gl2-host-note" x-show="config.gliner2_mode === 'local' && status?.in_docker && !status?.torch_cuda_available">
                        <span class="material-symbols-outlined" aria-hidden="true">developer_board</span>
                        <span>
                            CPU mode works now. For CUDA, recreate the Agent Zero container with GPU
                            passthrough (commonly <code>--gpus all</code>); a running container cannot
                            grant itself new host-device access.
                        </span>
                    </div>
                </section>

                <section class="gl2-panel">
                    <div class="gl2-panel-heading">
                        <div>
                            <div class="gl2-kicker">02 / AGENT ZERO</div>
                            <h2>Wire extraction into memory</h2>
                        </div>
                    </div>

                    <div class="gl2-option-grid">
                        <label class="gl2-option">
                            <span>
                                <strong>Direct agent tool</strong>
                                <small>Expose <code>gliner2_extract</code>.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_tool_enabled" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Utility replacement</strong>
                                <small>Intercept only compatible memory calls.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_utility_replacement_enabled" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Safe Utility fallback</strong>
                                <small>Use the selected model when extraction cannot decide.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_fallback_to_utility_model" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Usage observability</strong>
                                <small>Write GLiNER2 replacements to the run log.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_usage_logging" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Memory keywords</strong>
                                <small>Extract entity-led recall keywords.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_memory_keyword_extraction" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Recall query enrichment</strong>
                                <small>Build focused recall queries from entities.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_recall_query_enrichment" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Memory relevance filter</strong>
                                <small>Classify recalled memories before context injection.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_memory_post_filter" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Consolidation triage</strong>
                                <small>Bypass obvious keep/skip decisions only.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_consolidation_triage" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                        <label class="gl2-option">
                            <span>
                                <strong>Knowledge metadata</strong>
                                <small>Attach extracted entities during import.</small>
                            </span>
                            <span class="toggle">
                                <input type="checkbox" x-model="config.gliner2_knowledge_import_enrichment" />
                                <span class="toggler"></span>
                            </span>
                        </label>
                    </div>

                    <details class="gl2-details">
                        <summary>
                            <span>Advanced memory tuning</span>
                            <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
                        </summary>
                        <div class="gl2-field-grid gl2-details-body">
                            <label class="gl2-field">
                                <span>Entity threshold</span>
                                <small>Applied to all four extraction task types.</small>
                                <input type="number" min="0" max="1" step="0.01" x-model.number="config.gliner2_entity_threshold" />
                            </label>
                            <label class="gl2-field">
                                <span>Post-filter threshold</span>
                                <input type="number" min="0" max="1" step="0.01" x-model.number="config.gliner2_post_filter_threshold" />
                            </label>
                            <label class="gl2-field">
                                <span>Consolidation threshold</span>
                                <input type="number" min="0" max="1" step="0.01" x-model.number="config.gliner2_consolidation_triage_threshold" />
                            </label>
                            <label class="gl2-field gl2-field-wide">
                                <span>Memory entity types (JSON array or comma list)</span>
                                <textarea rows="3" x-model="config.gliner2_memory_entity_types"></textarea>
                            </label>
                            <label class="gl2-field gl2-field-wide">
                                <span>Import entity types (JSON array or comma list)</span>
                                <textarea rows="3" x-model="config.gliner2_import_entity_types"></textarea>
                            </label>
                        </div>
                    </details>
                </section>

                <section class="gl2-panel">
                    <div class="gl2-panel-heading">
                        <div>
                            <div class="gl2-kicker">03 / GUARDRAILS</div>
                            <h2>Bound each inference call</h2>
                        </div>
                    </div>
                    <div class="gl2-field-grid gl2-three">
                        <label class="gl2-field">
                            <span>Maximum text characters</span>
                            <small>Hard ceiling: 200,000.</small>
                            <input type="number" min="1000" max="200000" step="1000" x-model.number="config.gliner2_max_text_chars" />
                        </label>
                        <label class="gl2-field">
                            <span>Maximum schema items</span>
                            <small>Counts nested labels and fields.</small>
                            <input type="number" min="1" max="500" step="1" x-model.number="config.gliner2_max_schema_items" />
                        </label>
                        <label class="gl2-field">
                            <span>Model max length</span>
                            <small>0 uses the checkpoint default.</small>
                            <input type="number" min="0" max="8192" step="1" x-model.number="config.gliner2_max_len" />
                        </label>
                        <label class="gl2-field">
                            <span>Operation timeout (seconds)</span>
                            <small>Bounds explicit extraction and Utility replacement waits.</small>
                            <input type="number" min="1" max="600" step="1" x-model.number="config.gliner2_operation_timeout_seconds" />
                        </label>
                    </div>
                </section>

                <section class="gl2-lab">
                    <div class="gl2-panel-heading">
                        <div>
                            <div class="gl2-kicker">04 / TEST BENCH</div>
                            <h2>Run one real extraction</h2>
                        </div>
                    </div>

                    <div class="gl2-task-tabs" role="tablist" aria-label="Extraction task">
                        <template x-for="task in ['entities', 'classify', 'json', 'relations']" :key="task">
                            <button type="button" :class="{ 'is-active': testTask === task }" @click="setTask(task)" x-text="task"></button>
                        </template>
                    </div>

                    <div class="gl2-lab-grid">
                        <div class="gl2-lab-inputs">
                            <label class="gl2-field">
                                <span>Source text</span>
                                <textarea rows="6" x-model="testText"></textarea>
                            </label>
                            <label class="gl2-field">
                                <span>Schema JSON</span>
                                <textarea rows="6" x-model="testSchemaText"></textarea>
                            </label>
                            <button type="button" class="gl2-button gl2-button-primary gl2-run" @click="runTestExtraction()" :disabled="testRunning">

                                <span x-text="testRunning ? 'Extracting…' : 'Run extraction'"></span>

                        </div>
                        <div class="gl2-output">
                            <div class="gl2-output-head">
                                <span>RESULT / JSON</span>
                                <span x-show="testRunning" class="gl2-live">LIVE</span>
                            </div>
                            <pre x-text="testRunning ? 'Inference in progress…' : (testResult || 'No run yet. Results appear here without changing saved settings.')"></pre>
                        </div>
                    </div>
                </section>

                <details class="gl2-details gl2-diagnostics">
                    <summary>
                        <span>Raw runtime diagnostics</span>
                        <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>

                </details>
            </main>
        </template>
    </div>

    <style>
        .gl2-shell {

            pointer-events: none;
